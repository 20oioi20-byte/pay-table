<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인건비 분석 보고서</title>
<style>
/* ===== 화면(조작 패널) — KT 화이트 ===== */
:root{--red:#FE2E36;--acc-bg:#FFE9EA;--acc-t:#D9141D;--bg:#F4F4F5;--card:#FFFFFF;--line:#E6E6E8;--soft:#F1F1F2;--t:#000000;--m:#4C4C4E;--f:#A2A4A3}
*{box-sizing:border-box}
body{margin:0;font-family:'KT Flow','Pretendard','Malgun Gothic','Apple SD Gothic Neo','WenQuanYi Zen Hei',sans-serif;background:var(--bg);color:var(--t);font-size:13px}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px;max-width:1240px;margin:0 auto}
.panel{background:var(--card);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);align-self:start;position:sticky;top:20px}
.panel section{padding:14px 18px;border-bottom:1px solid var(--line)}.panel section:last-child{border:0}
.panel h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}.logo::before{content:'';width:10px;height:18px;background:var(--red);border-radius:2px}
.panel label{display:block;font-size:11.5px;color:var(--m);margin:8px 0 4px}
.panel select,.panel input[type=number]{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;font-size:12.5px}

.seg button{border:0;background:#fff;padding:8px 0;font-size:12px;cursor:pointer;color:var(--m)}.seg button.on{background:var(--red);color:#fff;font-weight:bold}

</style>
<!-- 보고서 본문 스타일: 화면과 Word가 같은 CSS를 씀 (Word가 지원하는 속성만 사용) -->

<body>
<div class="app">
<aside class="panel">
  <section><div class="logo">인건비 분석 보고서</div><div class="hint">가상 데이터 · 화면과 Word가 같은 모양으로 저장됩니다.</div></section>
  <section><h4>대상</h4>
    <label>센터</label><select id="fCenter"></select>
    <label>기준 연도</label><select id="fYear"></select>
  </section>
  <section><h4>비교 자료</h4>
    <div class="seg" id="fSrc"><button data-v="in" class="on">내부 자료만</button><button data-v="ext">내부 + 채용시장</button></div>
    <div class="hint">채용시장 = 채용공고에 게시된 상담사·관리자 월 급여 표본(지역·세부산업 기준). 실제 시스템에서는 고용24 채용정보 API 또는 수기 입력으로 수집합니다.</div>
  </section>
  <section><h4>인상률 산출 기준</h4>
    <label>목표 기준</label><select id="fTarget"></select>
    <label>내년 최저임금 인상률 전망 (%)</label><input type="number" id="fMw" step="0.1">
    <div class="hint" id="mwHint"></div>
    <label>간접비율</label>
    <div class="seg" id="fInd"><button data-v="keep" class="on">현 비율 유지</button><button data-v="restore">2020년 수준 회복</button></div>
  </section>
  <section><h4>산출 요약</h4><div class="calc" id="calc"></div></section>
  <section>
    <button class="btn pri" id="btnWord">Word로 저장 (.doc)</button>
    <button class="btn" id="btnPrint">인쇄 · PDF</button>
  </section>
</aside>
<main><div class="paper"><div class="rp" id="doc"></div></div></main>
</div>

<script>
/* ================= 기준 자료 ================= */
/* 최저시급(고용노동부 고시) — 공개 자료 */
const MW = { 2019:8350, 2020:8590, 2021:8720, 2022:9160, 2023:9620, 2024:9860, 2025:10030, 2026:10320 };
const YEARS = [2020, 2021, 2022, 2023, 2024, 2025, 2026];
const BURDEN = 0.185; /* 법정부담률(4대보험 사업주분·퇴직급여 충당) 가정 */
const JOBS = ['상담사', '관리자'];
const TREE = {
  '공공':{ k:1.00, w:28, subs:{ '중앙부처':1.02, '지자체':0.98, '공공기관':1.03, '공공 그 외':0.97 }, sw:[25, 35, 30, 10] },
  '금융':{ k:1.12, w:24, subs:{ '보험':1.00, '은행':1.05, '카드':1.02, '증권':1.07, '금융 그 외':0.96 }, sw:[40, 15, 20, 10, 15] },
  '통신':{ k:1.05, w:14, subs:{ '이동통신':1.03, '유선·인터넷':1.00, '알뜰폰':0.94, '통신 그 외':0.97 }, sw:[45, 30, 15, 10] },
  '유통·커머스':{ k:0.96, w:20, subs:{ '이커머스':1.02, '홈쇼핑':1.00, '대형마트·백화점':0.98, '유통 그 외':0.96 }, sw:[40, 25, 20, 15] },
  '제조·기타':{ k:0.98, w:14, subs:{ '가전·전자':1.03, '자동차':1.05, '여행·레저':0.95, '기타':0.96 }, sw:[30, 25, 20, 25] }
};
const IND = Object.keys(TREE);
const REG = ['서울', '경기', '인천', '부산', '대구', '광주', '대전', '충북', '충남', '전북', '경북', '경남'];

/* ================= 가상 데이터: 센터 × 연도 × 직군 =================
   급여테이블에서 읽는 값: 기본급, 수당(기준급여 소계 − 기본급), B등급 업적수당, 고정 초과·야간·통신, 월 소정시간(기본급 수식)
   센터 정보에서 읽는 값: 산업군·세부산업·지역, 직군별 인원, 월 도급단가(1인), 간접비율 */
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (a, w) => { let r = rnd() * w.reduce((s, x) => s + x, 0); for(let i = 0; i < a.length; i++){ if((r -= w[i]) < 0) return a[i]; } return a[0]; };
const CENTERS = [];
for(let c = 1; c <= 160; c++){
  const ind = pick(IND, IND.map(i => TREE[i].w)), sub = pick(Object.keys(TREE[ind].subs), TREE[ind].sw), reg = pick(REG, [28, 22, 6, 7, 5, 4, 6, 3, 4, 3, 3, 4]);
  const k = TREE[ind].k * TREE[ind].subs[sub] * (reg === '서울' ? 1.04 : 1) * (0.93 + rnd() * 0.12);
  const ir0 = 0.10 + rnd() * 0.05, irDrift = -0.004 + rnd() * 0.005; /* 간접비율: 단가 인상이 인건비를 못 따라가면 하락 */
  const lagK = 0.6 + rnd() * 0.6; /* 단가 인상이 인건비 인상을 따라가는 정도 */
  const mg0 = 0.01 + rnd() * 0.07, allowK = (0.18 + rnd() * 0.12) * k / 1.0, perfR = 0.08 + rnd() * 0.08;
  const heads0 = { 상담사:40 + Math.round(rnd() * 160) };
  heads0.관리자 = Math.max(3, Math.round(heads0.상담사 * (0.07 + rnd() * 0.05)));
  const years = {};
  YEARS.forEach((y, yi) => {
    const mg = Math.max(0.002, mg0 + (rnd() - 0.55) * 0.02 + (k - 1) * 0.25);
    const jobs = {};
    JOBS.forEach(j => {
      const hours = 209, base = Math.round(MW[y] * hours * (1 + mg) * (j === '관리자' ? 1.22 : 1) / 1000) * 1000;
      const allow = Math.round(base * allowK * (j === '관리자' ? 1.7 : 1) / 1000) * 1000;
      const perf = Math.round(base * perfR * (j === '관리자' ? 1.5 : 1) / 1000) * 1000;
      const extra = Math.round((30000 + base * 0.04 * rnd()) / 1000) * 1000;
      jobs[j] = { hours, base, allow, perf, extra, heads:Math.round(heads0[j] * (0.92 + rnd() * 0.16)) };
    });
    years[y] = { jobs, ir:Math.max(0.05, ir0 + irDrift * yi) };
  });
  /* 월 도급단가(상담사 1인 기준) = 직접인건비 × (1+법정부담) × (1+간접비율) ÷ 상담사 인원 */
  YEARS.forEach(y => { const Y = years[y], cost = JOBS.reduce((s, j) => s + total(Y.jobs[j]) * Y.jobs[j].heads, 0) * (1 + BURDEN); Y.price = Math.round(cost * (1 + Y.ir) / Y.jobs.상담사.heads / 1000) * 1000; });
  CENTERS.push({ name:`가상센터${String(c).padStart(3, '0')}`, ind, sub, reg, years });
}
/* 채용시장 표본(가상): 세부산업·직군별 공고 월 급여 */
const MARKET = {};

/* ================= 산출 정의 (보고서·통계 공통) =================
   월 총임금 = 기본급 + 수당 + B등급 업적수당 + 고정 초과·야간·통신  (= 급여테이블 '월 보수 합계' B등급 기준)
   환산 시급 = (기본급 + 수당 + B등급 업적수당) ÷ 월 소정시간(기본급 수식의 시간수)  ← 초과·야간은 추가 근로 대가라 제외
   ※ 기존 v2: 비교 월액 = B등급 행 값 → 실제 양식에서는 '업적수당 금액'이라 시급이 3천원대로 계산되는 오류 */
function total(J){ return J.base + J.allow + J.perf + J.extra; }
function hourly(J){ return (J.base + J.allow + J.perf) / J.hours; }
function margin(J, y){ return J.base / (MW[y] * J.hours) - 1; }
/* 직군 묶음(인원 가중) */
function grp(C, y, job){
  const Y = C.years[y]; if(!Y) return null;
  const js = job === '전체' ? JOBS : [job];
  let h = 0, t = 0, hr = 0, b = 0, al = 0, pf = 0, ex = 0, hrs = 0;
  js.forEach(j => { const J = Y.jobs[j]; h += J.heads; t += total(J) * J.heads; hr += hourly(J) * J.heads; b += J.base * J.heads; al += J.allow * J.heads; pf += J.perf * J.heads; ex += J.extra * J.heads; hrs += J.hours * J.heads; });
  return { heads:h, total:t / h, hourly:hr / h, base:b / h, allow:al / h, perf:pf / h, extra:ex / h, hours:hrs / h, margin:Math.min(...js.map(j => margin(Y.jobs[j], y))) };
}
const median = a => { const v = a.filter(x => x != null).sort((x, y) => x - y); if(!v.length) return null; const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const quant = (a, q) => { const v = a.filter(x => x != null).sort((x, y) => x - y); if(!v.length) return null; const p = (v.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return v[lo] + (v[hi] - v[lo]) * (p - lo); };
const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
/* 비교 집단 통계 (센터별 직군 평균의 분포) */
function dist(list, y, job, key = 'total'){
  const v = list.map(C => grp(C, y, job)).filter(Boolean).map(g => g[key]);
  return { n:v.length, med:median(v), p25:quant(v, .25), p60:quant(v, .6), p75:quant(v, .75), avg:mean(v), vals:v };
}
function market(C, y, job){
  const key = `${C.sub}|${job}|${y}`;
  if(!MARKET[key]){
    const d = dist(CENTERS.filter(x => x.sub === C.sub), y, job);
    let s = C.sub.length * 7 + y + job.length; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    MARKET[key] = { n:18 + Math.round(r() * 40), med:Math.round(d.med * (0.97 + r() * 0.08) / 10000) * 10000, src:'채용공고 표본(가상)' };
  }
  return MARKET[key];
}

/* ================= 표시 형식 ================= */
const won = v => v == null ? '–' : Math.round(v).toLocaleString();
const man = v => v == null ? '–' : `${Math.round(v / 10000).toLocaleString()}만`;
const manY = v => v == null ? '–' : `${Math.round(v * 12 / 10000).toLocaleString()}만`;
const pct = (v, d = 1) => v == null ? '–' : `${v > 0 ? '+' : ''}${(v * 100).toFixed(d)}%`;
const pct0 = (v, d = 1) => v == null ? '–' : `${(v * 100).toFixed(d)}%`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
const cls = v => v < 0 ? 'neg' : '';

/* ================= 상태 ================= */
const st = { center:null, year:2026, src:'in', target:'subMed', mw:null, indMode:'keep' };
const TARGETS = { subMed:'세부산업 중위수', indMed:'산업군 중위수', subP60:'세부산업 상위 40%', mkt:'채용시장 중위수', max:'세부산업 중위수·채용시장 중 높은 값' };
const mwRate = y => MW[y] / MW[y - 1] - 1;
const mwAvg3 = y => mean([0, 1, 2].map(i => mwRate(y - i)));

/* ================= 분석 ================= */
function analyze(){
  const C = CENTERS.find(c => c.name === st.center), y = st.year, ext = st.src === 'ext';
  const levels = [
    { key:'all', label:'전체 산업', list:CENTERS },
    { key:'ind', label:`산업군 · ${C.ind}`, list:CENTERS.filter(c => c.ind === C.ind) },
    { key:'sub', label:`세부산업 · ${C.sub}`, list:CENTERS.filter(c => c.sub === C.sub) }
  ];
  const groups = ['상담사', '관리자', '전체'].map(job => {
    const me = grp(C, y, job), prev = grp(C, y - 1, job);
    const lv = levels.map(L => { const d = dist(L.list, y, job); return { ...L, ...d, gap:me.total / d.med - 1, pr:d.vals.filter(v => v <= me.total).length / d.n }; });
    const mk = job === '전체' ? null : market(C, y, job);
    return { job, me, prev, yoy:me.total / prev.total - 1, lv, mk, mkGap:mk ? me.total / mk.med - 1 : null };
  });
  /* 연도별 인상률: 최저임금 vs 센터 단가 vs 센터 상담사 임금 */
  const trend = YEARS.slice(1).map(yy => {
    const a = C.years[yy], b = C.years[yy - 1], wa = grp(C, yy, '상담사').total, wb = grp(C, yy - 1, '상담사').total;
    const peer = CENTERS.filter(c => c.sub === C.sub), pr = mean(peer.map(c => c.years[yy].price / c.years[yy - 1].price - 1));
    return { y:yy, mw:mwRate(yy), price:a.price / b.price - 1, wage:wa / wb - 1, peerPrice:pr, ir:a.ir, irPeer:mean(CENTERS.filter(c => c.ind === C.ind).map(c => c.years[yy].ir)) };
  });
  const cum = k => trend.reduce((p, t) => p * (1 + t[k]), 1) - 1;
  /* 적정 단가 인상률 */
  const m = (st.mw ?? mwAvg3(y) * 100) / 100;
  const tgtOf = g => {
    const sub = g.lv[2], ind = g.lv[1];
    const t = { subMed:sub.med, indMed:ind.med, subP60:sub.p60, mkt:g.mk?.med ?? sub.med, max:Math.max(sub.med, g.mk?.med ?? 0) }[st.target];
    return t;
  };
  const jobRows = ['상담사', '관리자'].map(job => {
    const g = groups.find(x => x.job === job), tgt = tgtOf(g), gap = Math.max(0, tgt / g.me.total - 1);
    const need = (1 + m) * (1 + gap) - 1; /* 비교 기준도 내년에 최저임금만큼 오른다고 보고 격차를 더함 */
    return { job, cur:g.me.total, tgt, gap, need, heads:g.me.heads, add:g.me.total * need * g.me.heads * 12 * (1 + BURDEN) };
  });
  const costNow = jobRows.reduce((s, r) => s + r.cur * r.heads, 0), costAdd = jobRows.reduce((s, r) => s + r.cur * r.need * r.heads, 0);
  const labor = costAdd / costNow; /* 직접인건비 인상률(인원·임금 가중) */
  const Y = C.years[y], ir0 = C.years[2020].ir;
  const irTo = st.indMode === 'restore' ? Math.max(Y.ir, ir0) : Y.ir;
  const price = (1 + labor) * (1 + irTo) / (1 + Y.ir) - 1; /* 단가 = 직접인건비 × (1+법정부담) × (1+간접비율) */
  const minOnly = m; /* 하한: 임금 수준 유지(최저임금 인상분) */
  const annualAdd = (C.years[y].price * Y.jobs.상담사.heads * 12) * price;
  return { C, y, ext, levels, groups, trend, cum, m, jobRows, labor, price, minOnly, irNow:Y.ir, ir0, irTo, annualAdd, priceNow:Y.price, mgr:groups[1], cs:groups[0] };
}

/* ================= 차트 (회색 계열 + 강조 Red) — SVG를 Word 저장 시 PNG로 변환 ================= */
const F = "font-family=\"KT Flow, Malgun Gothic, WenQuanYi Zen Hei, sans-serif\"";
function chartCompare(A){
  /* 상담사 월 총임금: 비교 집단별 분포(P25~P75 막대, 중위수 눈금) + 우리 센터(빨간 점) */
  const g = A.cs, rows = g.lv.map(l => ({ label:l.label, p25:l.p25, p75:l.p75, med:l.med, n:l.n }));
  if(A.ext && g.mk) rows.push({ label:'채용시장(공고)', med:g.mk.med, n:g.mk.n, mk:true });
  const W = 640, rowH = 40, T = 26, L = 150, R = 70, H = T + rows.length * rowH + 30;
  const vals = rows.flatMap(r => [r.p25, r.p75, r.med]).concat(g.me.total).filter(Boolean);
  const lo = Math.floor(Math.min(...vals) * 0.97 / 100000) * 100000, hi = Math.ceil(Math.max(...vals) * 1.02 / 100000) * 100000;
  const x = v => L + (v - lo) / (hi - lo) * (W - L - R);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ${F} font-size="11"><rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  for(let v = lo; v <= hi; v += 100000) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${T - 6}" y2="${H - 26}" stroke="#F1F1F2"/>` + ((v / 100000) % 2 === 0 ? `<text x="${x(v)}" y="${H - 10}" text-anchor="middle" fill="#A2A4A3" font-size="10">${Math.round(v / 10000)}만</text>` : '');
  s += `<line x1="${x(g.me.total)}" x2="${x(g.me.total)}" y1="${T - 10}" y2="${H - 26}" stroke="#FE2E36" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s += `<text x="${x(g.me.total)}" y="${T - 12}" text-anchor="middle" fill="#FE2E36" font-weight="bold" font-size="11">${esc(A.C.name)} ${man(g.me.total)}</text>`;
  rows.forEach((r, i) => {
    const cy = T + i * rowH + rowH / 2;
    s += `<text x="0" y="${cy + 4}" fill="#000000" font-weight="bold">${esc(r.label)}</text><text x="${L - 10}" y="${cy + 4}" fill="#A2A4A3" text-anchor="end" font-size="10">${r.mk ? '공고 ' : ''}${r.n}${r.mk ? '건' : '곳'}</text>`;
    if(r.p25) s += `<rect x="${x(r.p25)}" y="${cy - 8}" width="${x(r.p75) - x(r.p25)}" height="16" fill="#D6D7D7" rx="2"/>`;
    s += `<line x1="${x(r.med)}" x2="${x(r.med)}" y1="${cy - 11}" y2="${cy + 11}" stroke="#000000" stroke-width="2.5"/>`;
    s += `<text x="${W - R + 8}" y="${cy + 4}" fill="#000000" font-size="11">${man(r.med)}</text>`;
    const d = g.me.total / r.med - 1;
    s += `<text x="${W}" y="${cy + 4}" text-anchor="end" fill="${d < 0 ? '#D9141D' : '#4C4C4E'}" font-size="10" font-weight="bold">${pct(d)}</text>`;
  });
  return s + `</svg>`;
}
function chartTrend(A){
  /* 연도별 인상률: 최저임금(검정 점선) / 센터 단가(빨강) / 센터 상담사 임금(회색) */
  const T = A.trend, W = 640, H = 230, L = 40, R = 16, Tp = 30, B = 28;
  const vals = T.flatMap(t => [t.mw, t.price, t.wage]), lo = Math.min(0, Math.floor(Math.min(...vals) * 100) / 100), hi = Math.ceil(Math.max(...vals) * 100 + 0.5) / 100;
  const x = i => L + 20 + i * (W - L - R - 40) / (T.length - 1), y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ${F} font-size="11"><rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  for(let v = lo; v <= hi + 1e-9; v += 0.01) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-9 ? '#A2A4A3' : '#F1F1F2'}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#A2A4A3" font-size="10">${Math.round(v * 100)}%</text>`;
  T.forEach((t, i) => { s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" fill="#4C4C4E" font-size="10.5">${t.y}</text>`; });
  const line = (k, c, w, dash) => `<polyline fill="none" stroke="${c}" stroke-width="${w}" ${dash ? 'stroke-dasharray="5 4"' : ''} points="${T.map((t, i) => `${x(i)},${y(t[k])}`).join(' ')}"/>` + T.map((t, i) => `<circle cx="${x(i)}" cy="${y(t[k])}" r="3.5" fill="${c}"/>`).join('');
  s += line('wage', '#A2A4A3', 2) + line('mw', '#000000', 2, true) + line('price', '#FE2E36', 2.5);
  const lt = T.at(-1), li = T.length - 1;
  s += `<text x="${x(li) + 6}" y="${y(lt.price) - 6}" fill="#FE2E36" font-weight="bold" font-size="10" text-anchor="end">${pct(lt.price)}</text>`;
  const lg = [['최저임금 인상률', '#000000', 1], ['센터 단가 인상률', '#FE2E36', 0], ['센터 상담사 임금 인상률', '#A2A4A3', 0]];
  lg.forEach(([n, c, d], i) => { const lx = L + i * 170; s += `<line x1="${lx}" x2="${lx + 20}" y1="12" y2="12" stroke="${c}" stroke-width="2.5" ${d ? 'stroke-dasharray="5 4"' : ''}/><text x="${lx + 26}" y="16" fill="#000000" font-size="10.5">${n}</text>`; });
  return s + `</svg>`;
}
function chartIr(A){
  /* 간접비율: 센터(회색 막대, 기준 연도 진하게) + 산업군 평균(빨간 선) */
  const T = [{ y:2020, ir:A.C.years[2020].ir, irPeer:mean(CENTERS.filter(c => c.ind === A.C.ind).map(c => c.years[2020].ir)) }].concat(A.trend);
  const W = 640, H = 200, L = 40, R = 16, Tp = 28, B = 26, lo = 0, hi = Math.ceil(Math.max(...T.flatMap(t => [t.ir, t.irPeer])) * 100 + 2) / 100;
  const bw = (W - L - R) / T.length, y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo)), cx = i => L + bw * i + bw / 2;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" ${F} font-size="11"><rect width="${W}" height="${H}" fill="#FFFFFF"/>`;
  for(let v = 0; v <= hi + 1e-9; v += 0.05) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#F1F1F2"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#A2A4A3" font-size="10">${Math.round(v * 100)}%</text>`;
  T.forEach((t, i) => { const last = i === T.length - 1;
    s += `<rect x="${cx(i) - 16}" y="${y(t.ir)}" width="32" height="${y(0) - y(t.ir)}" fill="${last ? '#4C4C4E' : '#D6D7D7'}"/><text x="${cx(i)}" y="${y(t.ir) - 5}" text-anchor="middle" fill="#000000" font-size="10" ${last ? 'font-weight="bold"' : ''}>${(t.ir * 100).toFixed(1)}%</text><text x="${cx(i)}" y="${H - 8}" text-anchor="middle" fill="#4C4C4E" font-size="10.5">${t.y}</text>`; });
  s += `<polyline fill="none" stroke="#FE2E36" stroke-width="2" points="${T.map((t, i) => `${cx(i)},${y(t.irPeer)}`).join(' ')}"/>` + T.map((t, i) => `<circle cx="${cx(i)}" cy="${y(t.irPeer)}" r="3" fill="#FE2E36"/>`).join('');
  s += `<rect x="${L}" y="7" width="12" height="10" fill="#4C4C4E"/><text x="${L + 16}" y="16" font-size="10.5">${esc(A.C.name)} 간접비율</text><line x1="${L + 160}" x2="${L + 180}" y1="12" y2="12" stroke="#FE2E36" stroke-width="2"/><text x="${L + 186}" y="16" font-size="10.5">${esc(A.C.ind)} 산업군 평균</text>`;
  return s + `</svg>`;
}

  <tr class="me"><td class="nw">적정(권장)</td><td>${esc(tgtName)} 도달 + 최저임금 전망, 간접비율 ${st.indMode === 'restore' ? `2020년 수준(${pct0(A.ir0)}) 회복` : `현 수준(${pct0(A.irNow)}) 유지`}</td><td class="r">${pct0(A.price)}</td><td class="r">${won(A.priceNow * (1 + A.price))}원</td></tr>
</table>
<div class="formula">필요 임금 인상률 = (1 + 최저임금 인상 전망) × (1 + max(0, 목표 기준 ÷ 현재 − 1)) − 1<br>
직접인건비 인상률 = Σ(직군별 현재 월 총임금 × 필요 인상률 × 인원) ÷ Σ(현재 월 총임금 × 인원)<br>
단가 인상률 = (1 + 직접인건비 인상률) × (1 + 목표 간접비율) ÷ (1 + 현재 간접비율) − 1 · 현재 월 단가 ${won(A.priceNow)}원</div>

<h2><span>6.</span> 산출 기준 및 유의사항</h2>
<ul>
  <li>월 총임금 = 기본급 + 수당 + B등급 업적수당 + 고정 초과·야간·통신 수당(급여테이블 ‘월 보수 합계’, B등급 기준). 평균은 인원 가중입니다.</li>
  <li>직군: 급여테이블에서 ‘리더그룹’으로 묶인 직무는 관리자, 그 외는 상담사로 분류했습니다.</li>
  <li>비교 집단은 ${y}년 각 센터의 최신 급여테이블이며, 같은 세부산업 센터가 5곳 미만이면 산업군 기준을 우선 참고합니다.${sub.n < 5 ? ` <b class="neg">현재 세부산업 표본 ${sub.n}곳 — 참고용</b>` : ''}</li>
  ${A.ext ? `<li>채용시장 값은 채용공고에 게시된 월 급여의 중위수로, 실제 지급액과 차이가 있을 수 있어 보조 근거로만 사용합니다.</li>` : ''}
  <li>법정부담률 ${BURDEN * 100}%는 4대보험 사업주 부담분·퇴직급여 충당을 합한 가정치입니다. 상여·복리후생비는 포함하지 않았습니다.</li>
  <li>이 보고서의 숫자는 시스템이 계산했으며, 최종 판단은 담당자가 합니다.${C.name.startsWith('가상') ? ' (가상 데이터)' : ''}</li>
</ul>`;
}

/* ================= 화면 ================= */
const $ = id => document.getElementById(id);
function renderCalc(A){
  $('calc').innerHTML = `상담사 월 총임금 <b>${man(A.cs.me.total)}원</b> (시급 ${won(A.cs.me.hourly)}원)<br>
    목표(${esc(TARGETS[st.target])}) <b>${man(A.jobRows[0].tgt)}원</b> · 격차 ${pct(A.jobRows[0].gap)}<br>
    최저임금 전망 <b>${pct0(A.m)}</b> · 직접인건비 <b>${pct(A.labor)}</b><br>
    간접비율 ${pct0(A.irNow)} → ${pct0(A.irTo)}<br>
    <span style="color:var(--red);font-weight:bold">적정 단가 인상률 ${pct0(A.price)}</span> (최소 ${pct0(A.minOnly)})`;
}
function render(){
  const A = analyze();
  $('doc').innerHTML = buildDoc(A);
  renderCalc(A);
  $('mwHint').textContent = `기본값 = 최근 3년 평균 ${(mwAvg3(st.year) * 100).toFixed(1)}% (${st.year - 2}~${st.year}년)`;
}
/* 초기값: 보험 센터 중 세부산업 중위수보다 낮은 곳 */
(function init(){
  const ins = CENTERS.filter(c => c.sub === '보험'), d = dist(ins, 2026, '상담사');
  st.center = (ins.find(c => { const g = grp(c, 2026, '상담사').total; return g < d.med * 0.98 && g > d.med * 0.94; }) || ins[0]).name;
  $('fCenter').innerHTML = IND.map(i => `<optgroup label="${i}">${CENTERS.filter(c => c.ind === i).sort((a, b) => a.sub.localeCompare(b.sub)).map(c => `<option value="${c.name}">${c.name} · ${c.sub}</option>`).join('')}</optgroup>`).join('');
  $('fCenter').value = st.center;
  $('fYear').innerHTML = YEARS.slice(1).reverse().map(y => `<option>${y}</option>`).join('');
  $('fTarget').innerHTML = Object.entries(TARGETS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('fMw').value = (mwAvg3(2026) * 100).toFixed(1);
})();
$('fCenter').onchange = e => { st.center = e.target.value; render(); };
$('fYear').onchange = e => { st.year = +e.target.value; $('fMw').value = (mwAvg3(st.year) * 100).toFixed(1); st.mw = null; render(); };
$('fTarget').onchange = e => { st.target = e.target.value; if((e.target.value === 'mkt' || e.target.value === 'max') && st.src !== 'ext'){ st.src = 'ext'; [...$('fSrc').children].forEach(b => b.classList.toggle('on', b.dataset.v === 'ext')); } render(); };
$('fMw').oninput = e => { st.mw = e.target.value === '' ? null : +e.target.value; render(); };
const seg = (id, key) => $(id).onclick = e => { const b = e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x => x.classList.toggle('on', x === b)); st[key] = b.dataset.v; render(); };
seg('fSrc', 'src'); seg('fInd', 'indMode');
$('btnPrint').onclick = () => {
  const w = window.open('', '_blank');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(fileBase())}</title><style>${$('docCss').textContent} @page{size:A4;margin:18mm 18mm} body{margin:0}</style></head><body><div class="rp">${$('doc').innerHTML}</div></body></html>`);

};

/* ================= Word 저장: MHTML(.doc) — 차트를 PNG 파트로 함께 넣어 Word에서 그대로 보이게 ================= */
const fileBase = () => `인건비분석보고서_${st.center}_${st.year}`.replace(/[\\/:*?"<>|]/g, '_');
function svgToPng(svg, w, h){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const g = c.getContext('2d'); g.scale(2, 2); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h); res(c.toDataURL('image/png').split(',')[1]); };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
const b64utf8 = s => { const b = new TextEncoder().encode(s); let bin = ''; for(let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const wrap76 = s => s.replace(/.{1,76}/g, '$&\r\n');
async function buildWord(){
  /* template 안에서 바꿔야 이미지 요청이 생기지 않음 */
  const tpl = document.createElement('template'), parts = []; tpl.innerHTML = $('doc').innerHTML; const clone = tpl.content;
  /* 화면에서 계산된 글꼴·색·테두리·여백을 요소마다 직접 넣어 Word가 클래스 CSS를 다르게 해석해도 같은 모양이 되게 함 */
  const live = [...$('doc').querySelectorAll('*')], copy = [...clone.querySelectorAll('*')];
  const PROPS = ['color', 'background-color', 'font-size', 'font-weight', 'text-align', 'line-height', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left', 'margin-top', 'margin-bottom'];
  live.forEach((el, k) => {
    if(el.closest('svg')) return;
    const cs = getComputedStyle(el), out = [];
    PROPS.forEach(pr => { const v = cs.getPropertyValue(pr); if(pr === 'background-color' && /rgba\(0, 0, 0, 0\)|transparent/.test(v)) return; out.push(`${pr}:${v}`); });
    ['top', 'right', 'bottom', 'left'].forEach(sd => { const w = cs.getPropertyValue(`border-${sd}-width`); if(parseFloat(w) > 0) out.push(`border-${sd}:${w} ${cs.getPropertyValue(`border-${sd}-style`)} ${cs.getPropertyValue(`border-${sd}-color`)}`); });
    out.push("font-family:'KT Flow','맑은 고딕','Malgun Gothic',sans-serif");
    copy[k].setAttribute('style', out.join(';'));
    if(/^T[DH]$/.test(el.tagName) && cs.whiteSpace === 'nowrap') copy[k].setAttribute('nowrap', '');
  });
  let i = 0;
  for(const box of clone.querySelectorAll('.chart')){
    const svg = box.querySelector('svg'); if(!svg) continue;
    const w = +svg.getAttribute('width'), h = +svg.getAttribute('height'), png = await svgToPng(svg.outerHTML, w, h);
    const name = `chart${++i}.png`;
    if(png){ parts.push({ name, png }); box.innerHTML = `<img src="report_files/${name}" width="${w}" height="${h}" alt="차트">`; }
  }
  /* Word 페이지 설정(A4, 여백 18mm, 인쇄 모양 보기) */
  const html = `<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>${esc(fileBase())}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
<style>@page Section1{size:21.0cm 29.7cm;margin:1.8cm 1.8cm 1.8cm 1.8cm;mso-page-orientation:portrait}div.Section1{page:Section1}
${$('docCss').textContent}</style></head>
<body><div class="Section1"><div class="rp">${tpl.innerHTML}</div></div></body></html>`;
  const B = '----=_NextPart_KTPAY', L = 'file:///C:/report.htm';
  let mht = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n`;
  mht += `--${B}\r\nContent-Location: ${L}\r\nContent-Transfer-Encoding: base64\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n${wrap76(b64utf8(html))}\r\n`;
  parts.forEach(p => { mht += `--${B}\r\nContent-Location: file:///C:/report_files/${p.name}\r\nContent-Transfer-Encoding: base64\r\nContent-Type: image/png\r\n\r\n${wrap76(p.png)}\r\n`; });
  return { mht:mht + `--${B}--\r\n`, html, parts };
}
$('btnWord').onclick = async () => {
  const { mht } = await buildWord();
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([mht], { type:'application/msword' })); a.download = fileBase() + '.doc'; a.click();
};
render();
</script>
