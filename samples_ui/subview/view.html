<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'KT Flow','Pretendard','Malgun Gothic','WenQuanYi Zen Hei',sans-serif;background:#F4F4F5;color:#000;font-size:13px;width:1200px;padding:20px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);padding:16px 18px}
h3{font-size:14px;display:flex;gap:8px;align-items:center}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag{font-size:11px;padding:3px 8px;border-radius:5px;background:#F1F1F2;color:#4C4C4E;font-weight:bold}
.kick{font-size:12px;color:#FE2E36;font-weight:bold;margin-bottom:6px}
.note{font-size:11.5px;color:#4C4C4E;margin-top:12px;line-height:1.6}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:#A2A4A3;font-weight:normal;text-align:left;padding:8px 10px;border-bottom:1px solid #E6E6E8}
td{padding:10px;border-bottom:1px solid #F1F1F2;white-space:nowrap;font-variant-numeric:tabular-nums}.r{text-align:right}
.dn{color:#D9141D}.thin{color:#A2A4A3}.soft{font-size:10.5px;padding:2px 6px;border-radius:4px;background:#F1F1F2;color:#4C4C4E;margin-left:6px}
.bar{position:relative;height:10px;background:#EDEDEE;border-radius:5px;width:130px}.bar b{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:#A2A4A3}.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.btn{font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid #E6E6E8;background:#fff}
.seg{display:inline-flex;border:1px solid #E6E6E8;border-radius:7px;overflow:hidden}.seg span{padding:6px 11px;font-size:12px;color:#4C4C4E}.seg .on{background:#000;color:#fff;font-weight:bold}
</style></head><body><div id="out"></div><script>
const D={"all":{"n":148,"heads":17999,"cur":3167,"prev":3062,"base":2333,"fixed":547,"perf":286},"inds":[{"name":"공공","n":44,"heads":5630,"cur":3067,"prev":2961,"base":2262,"fixed":523,"perf":282,"subs":[{"name":"중앙부처","n":8,"heads":1052,"cur":3056,"prev":2959,"base":2235,"fixed":542,"perf":279},{"name":"지자체","n":15,"heads":1873,"cur":2969,"prev":2871,"base":2182,"fixed":521,"perf":266},{"name":"공공기관","n":14,"heads":1713,"cur":3187,"prev":3065,"base":2371,"fixed":530,"perf":286},{"name":"공공 그 외","n":7,"heads":992,"cur":3058,"prev":2953,"base":2254,"fixed":496,"perf":308}]},{"name":"금융","n":37,"heads":4179,"cur":3501,"prev":3389,"base":2593,"fixed":602,"perf":307,"subs":[{"name":"보험","n":18,"heads":1854,"cur":3531,"prev":3396,"base":2569,"fixed":632,"perf":330},{"name":"은행","n":5,"heads":538,"cur":3561,"prev":3480,"base":2670,"fixed":586,"perf":305},{"name":"카드","n":8,"heads":972,"cur":3324,"prev":3207,"base":2521,"fixed":522,"perf":280},{"name":"증권","n":4,"heads":585,"cur":3664,"prev":3523,"base":2745,"fixed":667,"perf":251},{"name":"금융 그 외","n":2,"heads":230,"cur":3462,"prev":3407,"base":2513,"fixed":572,"perf":377}]},{"name":"통신","n":19,"heads":2426,"cur":3251,"prev":3134,"base":2358,"fixed":587,"perf":307,"subs":[{"name":"이동통신","n":5,"heads":556,"cur":3238,"prev":3123,"base":2335,"fixed":594,"perf":309},{"name":"유선·인터넷","n":9,"heads":1198,"cur":3287,"prev":3159,"base":2389,"fixed":586,"perf":311},{"name":"알뜰폰","n":2,"heads":387,"cur":3248,"prev":3144,"base":2375,"fixed":580,"perf":293},{"name":"통신 그 외","n":3,"heads":285,"cur":3130,"prev":3042,"base":2245,"fixed":582,"perf":303}]},{"name":"유통·커머스","n":25,"heads":2876,"cur":2973,"prev":2867,"base":2184,"fixed":517,"perf":272,"subs":[{"name":"이커머스","n":9,"heads":988,"cur":2988,"prev":2876,"base":2225,"fixed":512,"perf":251},{"name":"홈쇼핑","n":8,"heads":791,"cur":2891,"prev":2782,"base":2080,"fixed":533,"perf":279},{"name":"대형마트·백화점","n":5,"heads":633,"cur":3037,"prev":2928,"base":2193,"fixed":528,"perf":316},{"name":"유통 그 외","n":3,"heads":464,"cur":2994,"prev":2888,"base":2259,"fixed":489,"perf":246}]},{"name":"제조·기타","n":23,"heads":2888,"cur":2998,"prev":2894,"base":2226,"fixed":510,"perf":262,"subs":[{"name":"가전·전자","n":8,"heads":1083,"cur":3100,"prev":2991,"base":2313,"fixed":510,"perf":277},{"name":"자동차","n":6,"heads":633,"cur":3089,"prev":2970,"base":2293,"fixed":543,"perf":253},{"name":"여행·레저","n":3,"heads":406,"cur":2841,"prev":2737,"base":2118,"fixed":490,"perf":232},{"name":"기타","n":6,"heads":766,"cur":2862,"prev":2775,"base":2105,"fixed":492,"perf":265}]}]}, ALL=D.all.cur, MIN=5;
const yo=(c,p)=>(c/p-1)*100, ps=v=>`${v>=0?'+':''}${v.toFixed(1)}%`, w=v=>v.toLocaleString();
const dev=(v,thin)=>{const d=v/ALL-1,x=Math.min(50,Math.abs(d)/.1*50);return `<div class="bar"><b></b><i style="left:${d>=0?50:50-x}%;width:${x}%;background:${thin?'#D6D7D7':d>=0?'#4C4C4E':'rgba(254,46,54,.7)'}"></i></div><div style="font-size:10.5px;color:#4C4C4E;text-align:center;width:130px;margin-top:2px">${ps(d*100)}</div>`};
const v=new URLSearchParams(location.search).get('v');let h='';
if(v==='a'){ // 접이식 표
 const open='금융';
 h=`<div class="kick">A안 · 접이식 표 (산업군 5줄 → 클릭 시 세부유형 펼침)</div><div class="card"><div class="ch"><h3>산업군·세부유형별 인당 평균 연 총임금 <span class="tag">상담사 · 2026</span></h3><div style="display:flex;gap:8px"><span class="btn">모두 펼치기</span><span class="seg"><span class="on">간단히</span><span>임금 구성 열 보기</span></span></div></div>
 <table><thead><tr><th style="width:260px">산업군 / 세부유형</th><th class="r">센터</th><th class="r">인원</th><th class="r">2025</th><th class="r">2026</th><th class="r">인상률</th><th>전체 산업 대비</th></tr></thead><tbody>
 <tr style="background:#F1F1F2;font-weight:bold"><td>전체 산업</td><td class="r">${D.all.n}</td><td class="r">${w(D.all.heads)}</td><td class="r">${w(D.all.prev)}만</td><td class="r">${w(D.all.cur)}만</td><td class="r">${ps(yo(D.all.cur,D.all.prev))}</td><td>${dev(ALL)}</td></tr>
 ${D.inds.map(i=>{const o=i.name===open;return `<tr style="font-weight:bold;${o?'background:#FFF4F4':''}"><td><span style="display:inline-block;width:18px;color:${o?'#FE2E36':'#A2A4A3'}">${o?'▾':'▸'}</span>${i.name} <span style="font-weight:normal;color:#A2A4A3;font-size:11.5px">세부 ${i.subs.length}</span></td><td class="r">${i.n}</td><td class="r">${w(i.heads)}</td><td class="r" style="color:#4C4C4E">${w(i.prev)}만</td><td class="r">${w(i.cur)}만</td><td class="r">${ps(yo(i.cur,i.prev))}</td><td>${dev(i.cur)}</td></tr>`+(o?i.subs.slice().sort((a,b)=>(b.n>=MIN)-(a.n>=MIN)||b.cur-a.cur).map(s=>{const t=s.n<MIN;return `<tr class="${t?'thin':''}" style="background:#FFFBFB"><td style="padding-left:40px">${s.name}${t?'<span class="soft">표본 부족</span>':''}</td><td class="r">${s.n}</td><td class="r">${w(s.heads)}</td><td class="r">${w(s.prev)}만</td><td class="r">${w(s.cur)}만</td><td class="r">${ps(yo(s.cur,s.prev))}</td><td>${dev(s.cur,t)}</td></tr>`}).join(''):'')}).join('')}</tbody></table>
 <div class="note">· 기본은 산업군 5줄만 보여 한 화면에 들어옵니다. 산업군 줄을 누르면 그 아래로 세부유형이 펼쳐집니다(여러 개 동시 가능).<br>· 기본급·고정 수당·업적수당은 [임금 구성 열 보기]를 눌렀을 때만 열이 추가됩니다.</div></div>`;
}
if(v==='b'){ // 산업군별 카드 묶음
 const lo=2700,hi=3800,sx=x=>(x-lo)/(hi-lo)*100;
 h=`<div class="kick">B안 · 산업군별 카드 묶음 (세부유형을 가로 막대로 비교)</div><div class="card" style="margin-bottom:12px;padding:12px 18px"><div class="ch" style="margin:0"><h3>산업군·세부유형별 인당 평균 연 총임금 <span class="tag">상담사 · 2026</span></h3><span style="font-size:11.5px;color:#4C4C4E">막대 공통 축 2,700~3,800만 · <span style="color:#FE2E36">┃</span> 전체 산업 평균 ${w(ALL)}만 · 흐린 막대: 센터 5개 미만</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${D.inds.map(i=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">${i.name}</b><span style="font-size:11px;color:#A2A4A3">${i.n}개 센터 · ${w(i.heads)}명</span></div>
 <div style="display:flex;align-items:baseline;gap:8px;margin:6px 0 12px"><span style="font-size:22px;font-weight:800">${w(i.cur)}<small style="font-size:12px">만원</small></span><span style="font-size:12px;font-weight:bold">▲ ${yo(i.cur,i.prev).toFixed(1)}%</span><span style="font-size:11px;color:#A2A4A3">2025년 ${w(i.prev)}만</span></div>
 ${i.subs.slice().sort((a,b)=>b.cur-a.cur).map(s=>{const t=s.n<MIN;return `<div style="display:grid;grid-template-columns:96px 1fr 62px 46px;gap:8px;align-items:center;margin:7px 0;${t?'color:#A2A4A3':''}"><span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</span>
 <div style="position:relative;height:14px;background:#F1F1F2;border-radius:3px"><i style="position:absolute;left:0;top:0;bottom:0;width:${sx(s.cur)}%;background:${t?'#D6D7D7':'#4C4C4E'};border-radius:3px"></i><b style="position:absolute;left:${sx(ALL)}%;top:-3px;bottom:-3px;width:2px;background:#FE2E36"></b></div>
 <span class="r" style="font-size:12px;font-weight:bold;text-align:right">${w(s.cur)}만</span><span style="font-size:11px;text-align:right;color:#4C4C4E">${ps(yo(s.cur,s.prev))}</span></div>`}).join('')}</div>`).join('')}
 <div class="card" style="background:#000;color:#fff"><b style="font-size:14px">전체 산업</b><div style="font-size:26px;font-weight:800;margin:10px 0 4px">${w(ALL)}<small style="font-size:12px">만원</small></div><div style="font-size:12px;color:#C4C5C6">2025년 ${w(D.all.prev)}만 · ▲ ${yo(ALL,D.all.prev).toFixed(1)}%</div><div style="font-size:11.5px;color:#A2A4A3;margin-top:14px;line-height:1.6">${D.all.n}개 센터 · ${w(D.all.heads)}명<br>카드의 빨간 세로선이 이 값입니다.</div></div></div>
 <div class="note">· 산업군마다 카드 한 장, 그 안에서 세부유형을 높은 순으로 비교합니다. 숫자표보다 “어느 세부유형이 평균보다 높은가”가 먼저 보입니다.</div>`;
}
if(v==='c'){ // 덤벨 차트
 const lo=2750,hi=3700,W=560,sx=x=>(x-lo)/(hi-lo)*W;
 const rows=[];D.inds.forEach(i=>{rows.push({g:1,...i});i.subs.slice().sort((a,b)=>b.cur-a.cur).forEach(s=>rows.push({g:0,...s}))});
 h=`<div class="kick">C안 · 전년→당해 덤벨 차트 (위치·변화폭을 한 줄로)</div><div class="card"><div class="ch"><h3>산업군·세부유형별 인당 평균 연 총임금 <span class="tag">상담사 · 2025 → 2026</span></h3>
 <span style="font-size:11.5px;color:#4C4C4E;display:flex;gap:14px;align-items:center"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#D6D7D7;margin-right:4px"></i>2025</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#000;margin-right:4px"></i>2026</span><span><i style="display:inline-block;width:2px;height:12px;background:#FE2E36;margin-right:4px;vertical-align:-2px"></i>전체 산업 평균 ${w(ALL)}만</span></span></div>
 <div style="display:grid;grid-template-columns:200px ${W}px 1fr;font-size:11px;color:#A2A4A3;border-bottom:1px solid #E6E6E8;padding:6px 0"><span>산업군 / 세부유형</span><span style="position:relative">${[2800,3000,3200,3400,3600].map(t=>`<span style="position:absolute;left:${sx(t)}px;transform:translateX(-50%)">${w(t)}</span>`).join('')}&nbsp;</span><span style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:right"><span>2026</span><span>인상률</span><span>센터</span></span></div>
 ${rows.map(r=>{const t=!r.g&&r.n<MIN,c=t?'#A2A4A3':'#000';return `<div style="display:grid;grid-template-columns:200px ${W}px 1fr;align-items:center;padding:${r.g?'9px 0 5px':'4px 0'};${r.g?'border-top:1px solid #E6E6E8;margin-top:4px':''}">
 <span style="${r.g?'font-weight:bold':'padding-left:16px;color:'+(t?'#A2A4A3':'#4C4C4E')}">${r.name}${t?'<span class="soft">표본 부족</span>':''}</span>
 <svg width="${W}" height="${r.g?22:18}" style="overflow:visible">${[2800,3000,3200,3400,3600].map(x=>`<line x1="${sx(x)}" x2="${sx(x)}" y1="-6" y2="24" stroke="#F1F1F2"/>`).join('')}<line x1="${sx(ALL)}" x2="${sx(ALL)}" y1="-6" y2="24" stroke="#FE2E36" stroke-width="1.5"/>
 <line x1="${sx(r.prev)}" x2="${sx(r.cur)}" y1="${r.g?11:9}" y2="${r.g?11:9}" stroke="${t?'#E6E6E8':'#A2A4A3'}" stroke-width="${r.g?4:3}"/><circle cx="${sx(r.prev)}" cy="${r.g?11:9}" r="${r.g?5:4}" fill="#D6D7D7"/><circle cx="${sx(r.cur)}" cy="${r.g?11:9}" r="${r.g?6:4.5}" fill="${c}"/></svg>
 <span style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:right;${r.g?'font-weight:bold':''};color:${t?'#A2A4A3':'#000'}"><span>${w(r.cur)}만</span><span>${ps(yo(r.cur,r.prev))}</span><span>${r.n}</span></span></div>`}).join('')}
 <div class="note">· 점 위치로 수준을, 회색 선 길이로 1년간 오른 폭을 봅니다. 빨간 선(전체 평균)보다 왼쪽이면 평균 미만입니다.</div></div>`;
}
document.getElementById('out').innerHTML=h;
</script></body></html>
